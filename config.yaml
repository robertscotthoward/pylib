environments:
  prod:
    test:
      environment_variable: OSTYPE=linux-gnu
    port: 80
  local:
    test:
      environment_variable: "HOMEDRIVE=C:"
    port: 5000




all:
  coinbase:
    api_key: "FROM CREDENTIALS FILE"
    api_secret: "FROM CREDENTIALS FILE"

  google:
    gdrive:

  wordconv_path: 'C:\Program Files\Microsoft Office\root\Office16\Wordconv.exe'

  # Transcribes audio files (.mp3, .wav, .m4a, ...) to markdown with a speech model.
  audio_transcribe:
    enabled: true
    # Whisper auto-detects language when this is unset; set e.g. 'en' to pin it.
    language:
    # Files above this are skipped rather than half-transcribed: splitting long
    # recordings needs ffmpeg, which this does not shell out to.
    max_mb: 25
    model:
      class: openai_compatible
      provider: deepinfra
      base_url: https://api.deepinfra.com/v1/openai
      model: openai/whisper-large-v3
      api_key_env: DEEPINFRA_TOKEN
      # A long recording takes a while to upload and transcribe.
      timeout: 600

  # Describes image files (.jpg, .png, ...) with a vision model so photographs and
  # photographed documents get a searchable .md sibling like every other file type.
  # Set enabled: false to leave images unconverted.
  image_describe:
    enabled: true
    prompt: >-
      Describe this image for a searchable archive. State what it shows: people and what
      they are doing, the setting, and any objects that identify the occasion. Transcribe
      any visible text, signage, slides, whiteboards, or documents verbatim. If the image
      is primarily a document, transcribe it in full and structure it as markdown. Do not
      guess at names or dates that are not visible. Output only the description.
    model:
      class: openai_compatible
      provider: deepinfra
      base_url: https://api.deepinfra.com/v1/openai
      model: Qwen/Qwen2.5-VL-32B-Instruct
      api_key_env: DEEPINFRA_TOKEN
      # A description is short; a full-page document transcription is not, and this has
      # to cover the worst case.
      max_tokens: 4096
      timeout: 240

  # Post-processes OCR'd (Tesseract) markdown through an LLM to clean up formatting.
  # Swap providers by editing 'model' below — 'class: openai_compatible' works with
  # any OpenAI-style /chat/completions API (DeepInfra, OpenRouter, Together, a local
  # vLLM server, etc.), so switching providers is just base_url/model/api_key.
  ocr_postprocess:
    enabled: true
    prompt: >-
      Format the following document to make it more readable: fix spacing, punctuation,
      and structure, and organize it with clear headings and tables. Do not add, remove,
      infer, or alter any facts, numbers, names, dates, or URLs — preserve them exactly as
      given. Output only the reformatted document, with no preamble, commentary, or notes.
    model:
      class: openai_compatible
      provider: deepinfra
      base_url: https://api.deepinfra.com/v1/openai
      model: Qwen/Qwen2.5-VL-32B-Instruct
      api_key_env: DEEPINFRA_TOKEN
      # An instruct model, not a reasoning one: it emits no hidden "thinking" tokens, so
      # max_tokens only has to cover the visible answer. Reformatted output is roughly the
      # length of the OCR input, and this ceiling costs nothing when unused -- it is a cap,
      # not a reservation -- so it stays generous to protect multi-page scans from silent
      # truncation. (The previous reasoning model spent this budget thinking and timed out.)
      max_tokens: 16384
      # Measured unloaded: a sparse purchase-order page repairs in ~21s, a dense legal
      # page (5k characters) in ~41s. Latency climbs further when several repairs are in
      # flight, so this leaves headroom above the slow case; 90s was too tight and turned
      # every dense page into a timeout. Concurrency is capped separately by
      # PYLIB_LLM_CONCURRENCY (see fileconvert.LLM_CONCURRENCY) to stop that climb.
      timeout: 240




prod:




local:
